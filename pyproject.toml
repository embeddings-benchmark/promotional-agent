[project]
name = "mtebpost"
version = "0.1.0"
description = "Autopublish scheduled posts for a project: candidate detection, leaderboard queries, card rendering, approval-gated publishing."
readme = "README.md"
requires-python = ">=3.11"

# Base install is deliberately light. `mteb` pulls torch, transformers and
# sentence-transformers — around 2 GB — and only `scoreboard` needs it, so it lives
# behind an extra. Rendering a card is a three-second job and should not cost a
# deep-learning stack.
dependencies = [
    "playwright>=1.49",
]

[project.optional-dependencies]
leaderboard = ["mteb>=2.18.11"]
# CI installs this to run the suite; `uv run --extra dev pytest` does the same locally.
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mteb-scan = "mtebpost.scan:main"
mteb-render = "mtebpost.render:main"
mteb-validate = "mtebpost.validate:main"
mteb-publish = "mtebpost.publish:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mtebpost"]

# Pins resolution by date so the same command resolves the same versions later.
# Each post's fetch.py repeats this in its own PEP 723 header — those stay standalone
# scripts on purpose, because a post's provenance should not depend on the state of a
# shared environment.
[tool.uv]
exclude-newer = "2026-08-01T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# The rules the code is held to. Narrow on purpose: pyflakes + pycodestyle + import
# order + modernisation. `B` catches the exception-handling mistakes that matter most
# here, since almost every module's failure path is a `sys.exit` with a message.
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Each post's `fetch.py` is a PEP 723 provenance artifact: it is the exact query that
# produced a published post's numbers, frozen at the moment it ran. Linting it would
# invite edits, and an edit to a fetch script after publication breaks the one property
# the folder exists to provide.
extend-exclude = ["posts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # assertions read better unwrapped than contorted
