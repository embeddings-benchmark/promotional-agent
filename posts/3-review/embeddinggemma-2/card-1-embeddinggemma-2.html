<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="subject" id="subject"></div>
    <p class="subtitle" id="subtitle"></p>
  </div>
  <div class="brand">MTEB</div>
</header>

<table>
  <thead>
    <tr class="group" id="groups"></tr>
    <tr class="bench" id="bench"></tr>
  </thead>
  <tbody id="body"></tbody>
</table>
<p class="note" id="note"></p>
<footer><span id="credit"></span><span class="source" id="source"></span></footer>

<script>
const COPY = {
  title: "One open model, measured on six boards",
  subject: "google/embeddinggemma-2",
  subtitle: "Best open model under 1B total parameters on the image and code boards; mid-field on multilingual text.",
  note: "Mean(Task) per board. Best open = open weights in the registry; ≤1B = the registry's total parameter count. A dash is a model with no result on that board — a missing evaluation is not a low score.",
  credit: "Added to MTEB by schechterh · results submitted by KennethEnevoldsen",
  source: "Source: MTEB · leaderboard.mteb.org",
};

const d = JSON.parse(document.getElementById("card-data").textContent);
document.documentElement.dataset.mode = d.mode || "light";
document.getElementById("eyebrow").textContent = d.eyebrow;
document.getElementById("title").textContent = COPY.title;
document.getElementById("subject").textContent = COPY.subject;
document.getElementById("subtitle").textContent = COPY.subtitle;
document.getElementById("note").textContent = COPY.note;
document.getElementById("credit").textContent = COPY.credit;
document.getElementById("source").textContent = COPY.source;

const groups = [];
for (const c of d.columns) {
  if (groups.length && groups[groups.length - 1].group === c.group) groups[groups.length - 1].span += 1;
  else groups.push({group: c.group, span: 1});
}
// Real cells: a colspan per group heading, then one cell per benchmark. Nesting the whole
// header inside a single cell is what made the first attempt unreadable — the spans
// overflowed the cell they were in rather than spanning the columns.
document.getElementById("groups").innerHTML =
  "<th></th>" + groups.map((g) => `<th colspan="${g.span}">${g.group}</th>`).join("");
document.getElementById("bench").innerHTML =
  "<th>Mean (Task)</th>" + d.columns.map((c) =>
    `<th>${c.benchmark}</th>`).join("");

const split = (id) => id.includes("/") ? [id.split("/")[0], id.split("/").slice(1).join("/")] : ["", id];
const fmt = (b) => b == null ? "" : (b >= 1 ? `${+b.toFixed(b >= 10 ? 1 : 2)}B` : `${Math.round(b * 1000)}M`);
// Params appear once per row, in the first column: repeating the same size six times across
// a row of one model is noise, and for the per-column rows it would be six different sizes
// competing with the scores.
const label = (r) => r.fixed
  ? `<div class="who2">${split(r.label)[0]}</div><div class="name2">${split(r.label)[1]}</div>` +
    `<div class="params">${fmt(r.params_b)}</div>`
  : `<div class="rowlabel">${r.label}</div>`;

const rows = d.columns[0].rows.length;
let html = "";
for (let i = 0; i < rows; i++) {
  const first = d.columns[0].rows[i];
  html += `<tr class="${first.subject ? "subject" : ""}${first.muted ? " muted" : ""}"><td>${label(first)}</td>`;
  d.columns.forEach((c, ci) => {
    const r = c.rows[i];
    if (r.score == null) {
      html += `<td class="missing"><span class="score">—</span><div class="who">not run</div></td>`;
      return;
    }
    // A fixed-model row repeats its name in the label; a per-column row has to name the
    // model it is actually reporting, with the org de-emphasised above it.
    const who = r.fixed ? "" : `<div class="who">${split(r.model)[0]}</div><div class="name">${split(r.model)[1]}</div>`;
    const size = ci === 0 && !r.fixed && r.params_b != null
      ? `<div class="params">${fmt(r.params_b)}</div>` : "";
    html += `<td><span class="score">${r.score.toFixed(2)}</span>${who}${size}</td>`;
  });
  html += "</tr>";
}
document.getElementById("body").innerHTML = html;

// Bluesky caps alt text at 2000 characters, so this reads the table by column: six
// labelled rows per board in card order, rather than naming every model in every cell.
window.__altText = [
  `${d.eyebrow}: ${COPY.title}. ${COPY.subject}.`,
  COPY.subtitle,
  "Scores are Mean(Task) per board, compared only against models with complete results there. Per board, in row order — best, best open weights, best open under 1B parameters, jina-embeddings-v5-omni-small, BidirLM-Omni-2.5B-Embedding, google/embeddinggemma-2:",
  d.columns.map((c) => c.benchmark + ": " + c.rows.map((r) =>
    r.score == null ? "not run" : r.score.toFixed(2)).join(", ") + ".").join(" "),
  "Blank cells mean no complete result on that board. Source: MTEB, leaderboard.mteb.org.",
].join(" ");
</script>
