  .subtitle { font-size: 22px; color: var(--text-secondary); margin-top: 12px; line-height: 1.35; max-width: 900px; }

  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name { font-size: 30px; font-weight: 700; letter-spacing: 0.01em; color: var(--text-primary); }

  .plot { flex: 1; margin-top: 18px; display: flex; flex-direction: column; min-height: 0; }
  .bars { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 20px; }
  .row, .axis {
    display: grid;
    grid-template-columns: 420px 1fr 84px;
    align-items: center; gap: 14px;
  }
  .mname { line-height: 1.18; }
  .mname .org { display: block; color: var(--text-muted); font-size: 14px; }
  .mname .name { display: block; font-size: 19px; color: var(--text-primary); }
  .mname .size { display: block; color: var(--text-muted); font-size: 14px; }
  .row.baseline .mname .name { color: var(--text-secondary); font-style: italic; }

  .track { height: 32px; position: relative; }
  .fill {
    position: absolute; left: 0; top: 0; bottom: 0;

  .row.baseline .fill {

    border: 1.5px solid var(--peer);

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
  </div>
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="plot">
  <div class="bars" id="bars"></div>
  <div class="axis" id="axis"></div>
</div>

<footer>
  <span id="footer"></span>
  <span id="credit"></span>
</footer>

<script>
const COPY = {
  eyebrow: "New task on MTEB",
  title: "JuriFindIT: Italian legal questions written by legal professionals",
  subtitle: "{n_queries} questions. For each, a model must find the statutory articles that answer it, out of {n_documents}.",
  axis_label: "nDCG@10",
  axis_note: "Every model with results so far, plus keyword and random baselines",
  footer: "JuriFindITRetrieval. Source: leaderboard.mteb.org",
  credit: "Dataset: Dalla Noce et al., Findings of EACL 2026",
  baseline_labels: {
    "mteb/baseline-bm25s": "keyword-matching baseline",
    "mteb/baseline-random-encoder": "random baseline",
  },
};

const d = { ...COPY, ...JSON.parse(document.getElementById("card-data").textContent) };
d.subtitle = d.subtitle.replace(/\{(\w+)\}/g, (_, k) => Number(d[k]).toLocaleString("en-US"));
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
["eyebrow", "title", "subtitle", "footer", "credit"].forEach(k => set(k, d[k]));
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const rows = d.rows || [];
const AXIS_MAX = 80;

const splitName = n => {
  const i = n.indexOf("/");
  return i === -1 ? ["", n] : [n.slice(0, i + 1), n.slice(i + 1)];
};
const fmtCount = n => n >= 1e9 ? `${(n/1e9).toFixed(1)}B` : `${Math.round(n/1e6)}M`;
const sizeLine = r => {
  if (r.baseline) return d.baseline_labels[r.model] || "baseline";
  if (r.n_parameters == null) return "size not published";
  if (r.n_active_parameters === 0) return `${fmtCount(r.n_parameters)} parameters, static (no active parameters)`;
  return `${fmtCount(r.n_parameters)} parameters`;
};

document.getElementById("bars").innerHTML = rows.map(r => {
  const [org, name] = splitName(r.model);
  return `
    <div class="row${r.baseline ? " baseline" : ""}">
      <span class="mname">
        <span class="org">${org}</span>
        <span class="name">${name}</span>
        <span class="size">${sizeLine(r)}</span>
      </span>
      <span class="track"><span class="fill" style="width:${(r.score / AXIS_MAX * 100).toFixed(2)}%"></span></span>
      <span class="val">${r.score.toFixed(2)}</span>
    </div>`;
}).join("");

const ticks = [];
for (let v = 0; v <= AXIS_MAX; v += 20) ticks.push(v);
document.getElementById("axis").innerHTML = `
  <span></span>
  <span class="ticks">${ticks.map(v =>
    `<span style="left:${(v / AXIS_MAX * 100).toFixed(2)}%">${v}</span>`).join("")}</span>
  <span></span>
  <span></span>
  <span><span class="axis-name">${d.axis_label}</span>
        <span class="axis-note">${d.axis_note}</span></span>
  <span></span>`;

window.__altText = [
  `${d.eyebrow}: ${d.title}. ${d.subtitle}`,
  `Bar chart of nDCG@10 on JuriFindITRetrieval (${d.n_queries} questions, ${d.n_documents} statutory articles) for the ${d.n_models} models with results so far, plus two baselines, highest first:`,
  rows.map(r => `${r.model}, ${r.score.toFixed(2)} (${sizeLine(r)})`).join("; ") + ".",
  `${d.credit}. Source: MTEB, leaderboard.mteb.org.`,
].join(" ");
</script>
