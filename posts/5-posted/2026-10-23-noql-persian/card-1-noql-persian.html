    --surface:        #fcfcfb;
    --text-primary:   #0b0b0b;
    --text-secondary: #52514e;
    --text-muted:     #898781;
    --accent:         #3d7bff;
    --rival:          #a06bff;
    --peer:           #b9b7b0;
    --gridline:       #e1e0d9;
    --axis:           #c3c2b7;
    --hairline:       rgba(11, 11, 11, 0.10);
    --font-sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  [data-mode="dark"] {
    --surface:        #1a1a19;
    --text-primary:   #ffffff;
    --text-secondary: #c3c2b7;
    --text-muted:     #898781;
    --accent:         #5b8fff;
    --rival:          #a06bff;
    --peer:           #6f6d67;
    --gridline:       #2c2c2a;
    --axis:           #383835;
    --hairline:       rgba(255, 255, 255, 0.10);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 1200px; overflow: hidden;
    background: var(--surface); color: var(--text-primary);
    font-family: var(--font-sans);
    display: flex; flex-direction: column;
    padding: 44px 56px 32px;
  }

  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 24px; }
  .eyebrow {
    font-size: 18px; font-weight: 600; letter-spacing: 0.05em;
    text-transform: uppercase; color: var(--accent);
  }
  h1 { font-size: 46px; font-weight: 640; letter-spacing: -0.02em; margin-top: 10px; line-height: 1.12; }
  .subtitle { font-size: 22px; color: var(--text-secondary); margin-top: 12px; line-height: 1.35; max-width: 900px; }
  .specs { font-size: 16px; color: var(--text-muted); margin-top: 10px; }

  .brand { display: flex; align-items: center; gap: 12px; padding-top: 4px; }
  .brand-name { font-size: 30px; font-weight: 700; letter-spacing: 0.01em; color: var(--text-primary); }

  .plot { flex: 1; margin-top: 30px; }
  svg { width: 100%; height: 100%; display: block; overflow: visible; }
  .grid { stroke: var(--gridline); stroke-width: 1; }
  .axis-line { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--text-muted); font-size: 18px; }
  .axis-title { fill: var(--text-secondary); font-size: 19px; font-weight: 550; }
  .peer-dot { fill: var(--peer); }
  .subject-dot { fill: var(--accent); }
  .rival-dot { fill: var(--rival); }
  .subject-label { fill: var(--text-primary); font-size: 22px; font-weight: 640; }
  .subject-org { fill: var(--text-secondary); font-size: 15px; }
  .subject-score { fill: var(--text-secondary); font-size: 20px; }
  .rival-label { fill: var(--text-primary); font-size: 19px; font-weight: 600; }
  .peer-label { fill: var(--text-muted); font-size: 16px; }
  .peer-org { fill: var(--text-muted); font-size: 13px; opacity: 0.85; }

  footer {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-top: 12px; padding-top: 14px; border-top: 1px solid var(--hairline);
    font-size: 17px; color: var(--text-muted);
  }
  .source { font-size: 15px; color: var(--text-muted); }

  .logo {
    width: 39px; height: 41px; flex: none;   /* asset aspect 0.958 */
    background: var(--logo-uri) left center / contain no-repeat;
  }
</style>

<header>
  <div>
    <div class="eyebrow" id="eyebrow"></div>
    <h1 id="title"></h1>
    <div class="subtitle" id="subtitle"></div>
    <div class="specs" id="specs"></div>
  </div>
  <div class="brand">
    <span class="logo" role="img" aria-label="MTEB"></span>
    <span class="brand-name">MTEB</span>
  </div>
</header>

<div class="plot"><svg id="plot"></svg></div>

<footer>
  <span class="source" id="source"></span>
  <span id="footer"></span>
</footer>

<script>
// COPY — every sentence a person chose. fetch.py writes only #card-data.
const COPY = {
  eyebrow: "New model on MTEB · Persian",
  title: "A 12M-parameter Persian embedding model, scored on all 52 tasks",
  subtitle: "shekar-ai/Noql is the smallest of the 32 models with a published size and complete MTEB(fas, v2) results. The next-smallest, at 39M, scores higher.",
  specs: "",
  x_label: "Total parameters (log scale)",
  source: "MTEB(fas, v2), mean over 52 tasks · Source: leaderboard.mteb.org",
  footer: "Results submitted by amirivojdan",
};

const LABELLED = {};  // grey peers stay unnamed: at this density names collide and add nothing to the claim

const data = JSON.parse(document.getElementById("card-data").textContent);
const d = { ...COPY, ...data, y_label: `${data.benchmark}, Mean (Task)` };
const set = (id, v) => { const n = document.getElementById(id); if (n) n.textContent = v ?? ""; };
["eyebrow", "title", "subtitle", "specs", "source", "footer"].forEach(k => set(k, d[k]));
if (d.mode === "dark") document.documentElement.dataset.mode = "dark";

const svgEl = document.getElementById("plot");
const box = svgEl.getBoundingClientRect();
const W = Math.round(box.width), H = Math.round(box.height);
svgEl.setAttribute("viewBox", `0 0 ${W} ${H}`);
const M = { t: 36, r: 24, b: 58, l: 58 };
const pts = d.points;

const xs = pts.map(p => Math.log10(p.x)), ys = pts.map(p => p.y);
const xmin = Math.floor(Math.min(...xs) * 2) / 2 - 0.1;
const xmax = Math.ceil(Math.max(...xs) * 2) / 2 + 0.05;
const ymin = Math.floor((Math.min(...ys) - 3) / 5) * 5, ymax = Math.ceil((Math.max(...ys) + 3) / 5) * 5;
const X = v => M.l + (Math.log10(v) - xmin) / (xmax - xmin) * (W - M.l - M.r);
const Y = v => H - M.b - (v - ymin) / (ymax - ymin) * (H - M.t - M.b);
const fmt = n => n >= 1e9 ? (n / 1e9) + "B" : n >= 1e6 ? Math.round(n / 1e6) + "M" : Math.round(n / 1e3) + "K";

const el = (t, a, txt) => {
  const n = document.createElementNS("http://www.w3.org/2000/svg", t);
  for (const k in a) n.setAttribute(k, a[k]);
  if (txt != null) n.textContent = txt;
  svgEl.appendChild(n); return n;
};

for (let v = ymin; v <= ymax; v += 5) {
  el("line", { x1: M.l, x2: W - M.r, y1: Y(v), y2: Y(v), class: "grid" });
  el("text", { x: M.l - 12, y: Y(v) + 6, class: "tick", "text-anchor": "end" }, v);
}
const xticks = [];
for (let e = Math.floor(xmin); e <= Math.ceil(xmax); e++)
  for (const m of [1, 3]) { const v = m * 10 ** e; const lv = Math.log10(v); if (lv >= xmin && lv <= xmax) xticks.push(v); }
for (const v of xticks) el("text", { x: X(v), y: H - M.b + 28, class: "tick", "text-anchor": "middle" }, fmt(v));
el("line", { x1: M.l, x2: W - M.r, y1: H - M.b, y2: H - M.b, class: "axis-line" });
el("text", { x: (M.l + W - M.r) / 2, y: H - 6, class: "axis-title", "text-anchor": "middle" }, d.x_label);
el("text", { x: 0, y: 12, class: "axis-title", "text-anchor": "start" }, d.y_label);

const splitName = n => { const i = n.indexOf("/"); return i === -1 ? [null, n] : [n.slice(0, i + 1), n.slice(i + 1)]; };

const peers = pts.filter(p => !p.subject && !p.rival);
for (const p of peers) {
  el("circle", { cx: X(p.x), cy: Y(p.y), r: 6, class: "peer-dot" });
  const side = LABELLED[p.model];
  if (!side) continue;
  const [org, name] = splitName(p.model);
  const a = { x: X(p.x) + (side === "left" ? -11 : 11), "text-anchor": side === "left" ? "end" : "start" };
  el("text", { ...a, y: Y(p.y) - 3, class: "peer-org" }, org);
  el("text", { ...a, y: Y(p.y) + 14, class: "peer-label" }, name);
}
for (const p of pts.filter(p => p.rival)) {
  el("circle", { cx: X(p.x), cy: Y(p.y), r: 7.5, class: "rival-dot" });
  const a = { x: X(p.x) + 13, "text-anchor": "start" };
  el("text", { ...a, y: Y(p.y) - 22, class: "subject-org" }, splitName(p.model)[0]);
  el("text", { ...a, y: Y(p.y) - 3, class: "rival-label" }, splitName(p.model)[1]);
  el("text", { ...a, y: Y(p.y) + 19, class: "subject-score" }, `${p.y.toFixed(2)} · ${fmt(p.x)}`);
}
for (const p of pts.filter(p => p.subject)) {
  el("circle", { cx: X(p.x), cy: Y(p.y), r: 8.5, class: "subject-dot" });
  const a = { x: X(p.x) + 14, "text-anchor": "start" };
  el("text", { ...a, y: Y(p.y) - 24, class: "subject-org" }, splitName(p.model)[0]);
  el("text", { ...a, y: Y(p.y) - 4, class: "subject-label" }, splitName(p.model)[1]);
  el("text", { ...a, y: Y(p.y) + 19, class: "subject-score" }, `${p.y.toFixed(2)} · ${fmt(p.x)}`);
}

const subj = pts.find(p => p.subject), rival = pts.find(p => p.rival);
const best = [...pts].sort((a, b) => b.y - a.y)[0];
window.__altText = [
  `${d.title}. ${d.subtitle}`,
  `Scatter plot of ${d.y_label} against total parameters for the ${pts.length} models with complete results on all ${d.n_tasks} tasks and a published size.`,
  `${subj.model} scores ${subj.y.toFixed(2)} at ${fmt(subj.x)} total parameters, the smallest on the chart.`,
  rival ? `The next-smallest, ${rival.model}, scores ${rival.y.toFixed(2)} at ${fmt(rival.x)}.` : "",
  `Scores on the chart range from ${Math.min(...ys).toFixed(2)} to ${best.y.toFixed(2)} (${best.model}, ${fmt(best.x)}).`,
  `${d.footer}.`,
  "Source: leaderboard.mteb.org.",
].filter(Boolean).join(" ");
</script>
